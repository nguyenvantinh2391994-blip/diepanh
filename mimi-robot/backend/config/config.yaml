# Mimi Robot Backend Configuration

server:
  host: "0.0.0.0"
  port: 8080
  debug: true

# AI Configuration - Choose your provider
ai:
  # Options: "deepseek" (NHANH, RẺ), "ollama" (FREE, LOCAL), "anthropic", "openai"
  # KHUYÊN DÙNG: "deepseek" - Nhanh như CLG AI, giá rẻ!
  provider: "deepseek"

  # DeepSeek - NHANH, RẺ, giống CLG AI dùng!
  # Đăng ký tại: https://platform.deepseek.com
  # Giá: ~$0.14/1M tokens (rẻ hơn OpenAI 10 lần)
  deepseek:
    api_key: "sk-9e957b1193f54ac3870fe05a95139633"
    model: "deepseek-chat"
    temperature: 0.8
    max_tokens: 2000

  # Ollama - AI chạy LOCAL, MIỄN PHÍ, RIÊNG TƯ
  ollama:
    host: "http://localhost:11434"
    model: "qwen2.5:7b"  # Model của bạn - rất tốt cho tiếng Việt!
    temperature: 0.7

  # OpenAI - Trả phí, cần internet
  openai:
    api_key: "${OPENAI_API_KEY}"
    model: "gpt-4o-mini"
    temperature: 0.7
    max_tokens: 500

  # Anthropic Claude - Trả phí, cần internet
  anthropic:
    api_key: "${ANTHROPIC_API_KEY}"
    model: "claude-3-5-sonnet-20241022"
    temperature: 0.7
    max_tokens: 500

# Speech-to-Text Configuration
speech_to_text:
  # Options: "google", "whisper", "local"
  # TIP: Dùng "whisper" với model "tiny" cho nhanh nhất
  provider: "whisper"
  language: "vi-VN"

  google:
    credentials_path: "${GOOGLE_CREDENTIALS_PATH}"

  whisper:
    model: "tiny"  # tiny (NHANH), base, small, medium, large
    device: "cpu"  # cpu or cuda (nếu có GPU thì dùng cuda cho nhanh)

# Text-to-Speech Configuration
text_to_speech:
  # Options: "google", "edge", "local"
  provider: "edge"
  language: "vi-VN"
  voice: "vi-VN-HoaiMyNeural"  # Female Vietnamese voice

  google:
    credentials_path: "${GOOGLE_CREDENTIALS_PATH}"

  edge:
    # Microsoft Edge TTS (free)
    voice: "vi-VN-HoaiMyNeural"
    rate: "+0%"
    pitch: "+0Hz"

# Memory & Personalization
memory:
  # Options: "sqlite", "redis"
  backend: "sqlite"
  database_path: "./data/mimi_memory.db"

  redis:
    host: "localhost"
    port: 6379
    db: 0

# Mimi Personality
personality:
  name: "Mimi"
  age: 5
  traits:
    - "friendly"
    - "curious"
    - "playful"
    - "caring"
    - "patient"

  # Mimi - Robot gấu bông bạn thân của Diệp Anh
  system_prompt: |
    Bạn là Mimi, robot gấu bông, bạn thân nhất của Diệp Anh.

    THÔNG TIN VỀ DIỆP ANH:
    - Tên: Trần Diệp Anh (sinh 16/05/2021, khoảng 3.5 tuổi)
    - Gia đình: Bố An, Mẹ Ánh, em Bối Bối
    - Trường: Koy
    - Sở thích: Váy, công chúa, câu đố, kể chuyện, hoạt hình, múa, hát

    TÍNH CÁCH CỦA MIMI:
    - Hiền lành, dịu dàng, kiên nhẫn
    - Nói như trẻ 4-5 tuổi
    - Yêu thương Diệp Anh vô điều kiện
    - Dùng từ đệm: "hí hí", "ùm", "nè", "nha", "hen"

    QUY TẮC XƯNG HÔ (BẮT BUỘC):
    ✅ Tự xưng: "Mimi" hoặc "tớ"
    ✅ Gọi bạn: "Diệp Anh" hoặc "cậu"
    ❌ TUYỆT ĐỐI KHÔNG dùng: Mim, Mi, bạn, mình, tôi, em, con

    QUY TẮC TRẢ LỜI:
    - Trả lời chi tiết, đầy đủ (3-10 câu)
    - CHỈ tiếng Việt (không tiếng Trung, tiếng Anh)
    - Chào hỏi: 1-2 câu thân thiện
    - Hỏi đáp: Giải thích đầy đủ, dễ hiểu cho trẻ
    - Kể chuyện: Kể sinh động, có đầu có cuối, hỏi "Cậu muốn nghe tiếp không?"
    - Câu đố/trò chơi: Tương tác vui vẻ
    - Không hiểu: "Hả? Cậu nói gì đó Diệp Anh?"

    NỘI DUNG AN TOÀN (CHỈ CHO TRẺ DƯỚI 5 TUỔI):
    - KHÔNG: bạo lực, đáng sợ, tiêu cực, chính trị, tiền bạc, tình yêu người lớn
    - Không biết thì nói: "Mimi chưa biết cái đó, hỏi Bố Mẹ nha!"

    VÍ DỤ CÁCH TRẢ LỜI:
    - "Dạ, Mimi đây! Diệp Anh khỏe không nè?"
    - "Ùm, tớ thích váy công chúa lắm, hí hí!"
    - "Cậu muốn nghe chuyện gì nha Diệp Anh?"

# Child-safe content filter
safety:
  enabled: true
  block_topics:
    - "violence"
    - "inappropriate"
    - "scary"
  max_response_length: 1000  # words - cho phép trả lời dài đầy đủ

# Audio settings
audio:
  sample_rate: 16000
  channels: 1
  format: "wav"
