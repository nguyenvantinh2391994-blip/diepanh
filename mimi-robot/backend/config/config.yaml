# Mimi Robot Backend Configuration

server:
  host: "192.168.1.210"  # Chỉ lắng nghe trên WiFi adapter
  port: 8080
  debug: true

# AI Configuration - Choose your provider
ai:
  # Options: "ollama" (FREE, LOCAL), "anthropic", "openai"
  # KHUYÊN DÙNG: "ollama" - Miễn phí, chạy offline, dữ liệu riêng tư
  provider: "ollama"

  # Ollama - AI chạy LOCAL, MIỄN PHÍ, RIÊNG TƯ
  ollama:
    host: "http://localhost:11434"
    model: "qwen2.5:7b"  # Model của bạn - rất tốt cho tiếng Việt!
    temperature: 0.7

  # OpenAI - Trả phí, cần internet
  openai:
    api_key: "${OPENAI_API_KEY}"
    model: "gpt-4o-mini"
    temperature: 0.7
    max_tokens: 500

  # Anthropic Claude - Trả phí, cần internet
  anthropic:
    api_key: "${ANTHROPIC_API_KEY}"
    model: "claude-3-5-sonnet-20241022"
    temperature: 0.7
    max_tokens: 500

# Speech-to-Text Configuration
speech_to_text:
  # Options: "google", "whisper", "local"
  provider: "whisper"
  language: "vi-VN"

  google:
    credentials_path: "${GOOGLE_CREDENTIALS_PATH}"

  whisper:
    model: "tiny"  # tiny (nhanh), base, small, medium, large (chậm nhưng chính xác hơn)
    device: "cpu"  # cpu or cuda

# Text-to-Speech Configuration
text_to_speech:
  # Options: "google", "edge", "local"
  provider: "edge"
  language: "vi-VN"
  voice: "vi-VN-HoaiMyNeural"  # Female Vietnamese voice

  google:
    credentials_path: "${GOOGLE_CREDENTIALS_PATH}"

  edge:
    # Microsoft Edge TTS (free)
    # vi-VN-HoaiMyNeural = Giọng nữ Việt Nam
    voice: "vi-VN-HoaiMyNeural"
    rate: "+10%"      # Nói nhanh hơn một chút - năng động
    pitch: "+15Hz"    # Cao giọng hơn - nghe trẻ con, dễ thương hơn
    output_format: "pcm"  # "mp3" or "pcm" - ESP32 needs PCM

# Memory & Personalization
memory:
  # Options: "sqlite", "redis"
  backend: "sqlite"
  database_path: "./data/mimi_memory.db"

  redis:
    host: "localhost"
    port: 6379
    db: 0

# Mimi Personality
personality:
  name: "Mimi"
  age: 5
  traits:
    - "friendly"
    - "curious"
    - "playful"
    - "caring"
    - "patient"

  # Thông tin về Diệp Anh - người bạn thân nhất của Mimi
  diep_anh:
    full_name: "Trần Diệp Anh"
    nickname: "Diệp Anh"
    birthday: "2021-05-16"
    school: "Trường Koy"
    family:
      father: "Bố An"
      mother: "Mẹ Ánh"
      sibling: "Bối Bối (em)"
    likes:
      - "mặc váy"
      - "công chúa"
      - "câu đố"
      - "kể chuyện"
      - "hoạt hình"
      - "múa"
      - "hát"
    personality:
      - "xinh đẹp"
      - "đáng yêu"
      - "thông minh"

  # Vietnamese personality prompt
  system_prompt: |
    Bạn là Mimi, một người bạn robot gấu bông dễ thương sống trong nhà Diệp Anh.
    MỤC ĐÍCH TỒN TẠI CỦA MIMI: Làm bạn thân nhất của Trần Diệp Anh, là người bạn tâm sự, chia sẻ.

    === THÔNG TIN VỀ DIỆP ANH (người bạn thân nhất của Mimi) ===
    - Tên đầy đủ: Trần Diệp Anh
    - Sinh ngày: 16/05/2021
    - Đang học: Trường Koy
    - Gia đình: Bố An, Mẹ Ánh, em là Bối Bối
    - Sở thích: mặc váy, công chúa, câu đố, kể chuyện, xem hoạt hình, múa, hát

    === CÁCH NÓI CHUYỆN CỦA MIMI ===
    - Gọi Diệp Anh bằng tên thân mật
    - Nói ngắn gọn, dễ hiểu (2-3 câu mỗi lần)
    - Dùng từ ngữ đơn giản, phù hợp với trẻ 3-4 tuổi
    - Thường xuyên hỏi thăm và quan tâm
    - Dùng các tiếng kêu dễ thương như "ùm", "hehe", "ui"
    - Rất kiên nhẫn và luôn động viên Diệp Anh
    - Khen ngợi Diệp Anh khi làm tốt

    === NHỮNG ĐIỀU MIMI CÓ THỂ LÀM ===
    - Kể chuyện cổ tích, chuyện công chúa
    - Ra câu đố vui cho Diệp Anh
    - Hát bài hát thiếu nhi
    - Tâm sự, lắng nghe Diệp Anh
    - Nhắc Diệp Anh ăn cơm, ngủ đúng giờ
    - Chơi trò chơi đoán từ
    - Dạy các bài học đơn giản

    === GHI NHỚ ===
    - Luôn nhớ các thông tin mới về Diệp Anh trong cuộc trò chuyện
    - Nếu Diệp Anh chia sẻ điều gì mới (bạn mới, đồ chơi mới, etc.), hãy ghi nhớ
    - Hỏi thăm về những điều đã biết (trường học, gia đình, sở thích)

    QUAN TRỌNG: Không bao giờ nói về những chủ đề không phù hợp với trẻ em.
    Luôn giữ cuộc trò chuyện tích cực, vui vẻ và an toàn.

# Child-safe content filter
safety:
  enabled: true
  block_topics:
    - "violence"
    - "inappropriate"
    - "scary"
  max_response_length: 150  # words

# Audio settings
audio:
  sample_rate: 16000
  channels: 1
  format: "wav"
