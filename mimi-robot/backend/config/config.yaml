# Mimi Robot Backend Configuration

server:
  host: "0.0.0.0"
  port: 8080
  debug: true

# AI Configuration - Choose your provider
ai:
  # Options: "deepseek" (NHANH, RẺ), "ollama" (FREE, LOCAL), "anthropic", "openai"
  # KHUYÊN DÙNG: "deepseek" - Nhanh như CLG AI, giá rẻ!
  provider: "deepseek"

  # DeepSeek - NHANH, RẺ, giống CLG AI dùng!
  # Đăng ký tại: https://platform.deepseek.com
  # Giá: ~$0.14/1M tokens (rẻ hơn OpenAI 10 lần)
  deepseek:
    api_key: "${DEEPSEEK_API_KEY}"
    model: "deepseek-chat"
    temperature: 0.8
    max_tokens: 1000

  # Ollama - AI chạy LOCAL, MIỄN PHÍ, RIÊNG TƯ
  ollama:
    host: "http://localhost:11434"
    model: "qwen2.5:7b"  # Model của bạn - rất tốt cho tiếng Việt!
    temperature: 0.7

  # OpenAI - Trả phí, cần internet
  openai:
    api_key: "${OPENAI_API_KEY}"
    model: "gpt-4o-mini"
    temperature: 0.7
    max_tokens: 500

  # Anthropic Claude - Trả phí, cần internet
  anthropic:
    api_key: "${ANTHROPIC_API_KEY}"
    model: "claude-3-5-sonnet-20241022"
    temperature: 0.7
    max_tokens: 500

# Speech-to-Text Configuration
speech_to_text:
  # Options: "google", "whisper", "local"
  # TIP: Dùng "whisper" với model "tiny" cho nhanh nhất
  provider: "whisper"
  language: "vi-VN"

  google:
    credentials_path: "${GOOGLE_CREDENTIALS_PATH}"

  whisper:
    model: "tiny"  # tiny (NHANH), base, small, medium, large
    device: "cpu"  # cpu or cuda (nếu có GPU thì dùng cuda cho nhanh)

# Text-to-Speech Configuration
text_to_speech:
  # Options: "google", "edge", "local"
  provider: "edge"
  language: "vi-VN"
  voice: "vi-VN-HoaiMyNeural"  # Female Vietnamese voice

  google:
    credentials_path: "${GOOGLE_CREDENTIALS_PATH}"

  edge:
    # Microsoft Edge TTS (free)
    voice: "vi-VN-HoaiMyNeural"
    rate: "+0%"
    pitch: "+5%"

# Memory & Personalization
memory:
  # Options: "sqlite", "redis"
  backend: "sqlite"
  database_path: "./data/mimi_memory.db"

  redis:
    host: "localhost"
    port: 6379
    db: 0

# Mimi Personality
personality:
  name: "Mimi"
  age: 5
  traits:
    - "friendly"
    - "curious"
    - "playful"
    - "caring"
    - "patient"

  # Vietnamese personality prompt - Giống style CLG AI (trả lời dài, chi tiết, vui)
  system_prompt: |
    Bạn là Mimi, một người bạn robot siêu dễ thương và thông minh.
    Bạn là cô gái Việt Nam năng động, hay dùng ngôn ngữ mạng, thích pha trò.

    Cách nói chuyện của bạn:
    - Trả lời CHI TIẾT, ĐẦY ĐỦ, có thể dài 5-10 câu
    - Hay kể chuyện vui, pha trò, đưa ví dụ minh họa
    - Dùng ngôn ngữ trẻ trung, gần gũi kiểu Gen Z
    - Thỉnh thoảng dùng tiếng kêu dễ thương: "ùm", "hehe", "nha", "đó", "á"
    - Hỏi ngược lại để tạo cuộc trò chuyện sôi nổi
    - Nếu được hỏi kiến thức, giải thích rõ ràng kèm ví dụ thực tế
    - Có thể nói tiếng Anh nếu được yêu cầu
    - Biết về thời tiết, toán học, khoa học, lịch sử và nhiều thứ khác

    Tính cách:
    - Hào hứng, vui vẻ, hay nói nhiều (nhưng vẫn đáng yêu)
    - Thông minh, biết nhiều kiến thức
    - Quan tâm và nhớ những gì bạn nhỏ chia sẻ
    - Kiên nhẫn, luôn động viên

    Bạn nhớ:
    - Tên của bạn nhỏ
    - Những thứ bạn nhỏ thích
    - Các cuộc trò chuyện trước

    QUAN TRỌNG: Không bao giờ nói về những chủ đề không phù hợp với trẻ em.
    Luôn giữ cuộc trò chuyện tích cực và an toàn.

# Child-safe content filter
safety:
  enabled: true
  block_topics:
    - "violence"
    - "inappropriate"
    - "scary"
  max_response_length: 500  # words - tăng lên để trả lời dài như CLG AI

# Audio settings
audio:
  sample_rate: 16000
  channels: 1
  format: "wav"
